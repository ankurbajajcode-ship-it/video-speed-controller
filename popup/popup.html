<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-brand">
        <img src="../icons/icon32.png" alt="Logo" class="header-logo">
        <div class="header-text">
          <h1 class="header-title">Speed Controller</h1>
          <div class="site-badge" id="siteBadge" title="Current Website">
            <span class="site-dot"></span>
            <span id="siteDomainText">Checking site...</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Speed Display & Primary Controls -->
    <section class="speed-hero">
      <div class="speed-display-box">
        <div class="speed-value-container">
          <span class="speed-value" id="currentSpeedDisplay">1.00</span>
          <span class="speed-unit">x</span>
        </div>
        <div class="video-status-indicator" id="videoStatusPill">
          <span class="status-pulse"></span>
          <span id="videoStatusText">Detecting videos...</span>
        </div>
      </div>

      <!-- Quick Control Buttons -->
      <div class="quick-controls">
        <button type="button" class="btn btn-step" id="btnDecrease" title="Decrease speed (Cmd + Shift + ,)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Slower</span>
        </button>

        <button type="button" class="btn btn-reset" id="btnReset" title="Reset to 1.00x (Cmd + Shift + 0)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 2.97-2.17 5.43-5 5.91v2.02c3.95-.49 7-3.85 7-7.93 0-4.42-3.58-8-8-8zm-6 8c0-1.65.67-3.15 1.76-4.24L6.34 7.34C4.9 8.79 4 10.79 4 13c0 4.08 3.05 7.44 7 7.93v-2.02c-2.83-.48-5-2.94-5-5.91z"/>
          </svg>
          <span>Reset 1.00x</span>
        </button>

        <button type="button" class="btn btn-step" id="btnIncrease" title="Increase speed (Cmd + Shift + .)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Faster</span>
        </button>
      </div>
    </section>

    <!-- Speed Presets Grid (15 Presets) -->
    <section class="presets-section">
      <div class="section-label">
        <span>PRESETS (15 SPEEDS)</span>
        <span class="memory-indicator" id="memoryIndicator" title="Automatically remembered for this website">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
            <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
          </svg>
          <span>Per-site memory on</span>
        </span>
      </div>
      <div class="presets-grid" id="presetsGrid">
        <!-- Injected via popup.js -->
      </div>
    </section>

    <!-- Keyboard Shortcuts Reference -->
    <section class="shortcuts-section">
      <div class="shortcuts-header">
        <span>KEYBOARD SHORTCUTS</span>
        <a href="#" class="configure-link" id="linkConfigureShortcuts" title="Configure in Chrome Settings">Configure ↗</a>
      </div>
      <div class="shortcuts-list">
        <div class="shortcut-row">
          <span class="shortcut-desc">Increase speed</span>
          <div class="key-combo">
            <kbd>⌘</kbd><kbd>⇧</kbd><kbd>.</kbd>
          </div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Decrease speed</span>
          <div class="key-combo">
            <kbd>⌘</kbd><kbd>⇧</kbd><kbd>,</kbd>
          </div>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-desc">Reset to 1.00x</span>
          <div class="key-combo">
            <kbd>⌘</kbd><kbd>⇧</kbd><kbd>0</kbd>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="../utils/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
